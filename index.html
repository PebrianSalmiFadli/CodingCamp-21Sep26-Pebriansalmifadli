<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular Expense Tracker</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom Stylesheet (disesuaikan ke folder css/) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Non-blocking Notification Banner -->
    <div id="notification"></div>

    <div class="app-container">
        
        <!-- Header & Total Balance -->
        <header>
            <div>
                <p>Total Balance</p>
                <h1 id="balance-amount">$0.00</h1>
            </div>
        </header>

        <!-- Input Form -->
        <section>
            <h2>Add Transaction</h2>
            
            <form id="expense-form" novalidate>
                <div>
                    <label for="item-name">Item Name</label>
                    <input type="text" id="item-name" placeholder="e.g., Weekly groceries">
                    <span id="error-name" class="error"></span>
                </div>

                <div>
                    <label for="item-amount">Amount ($)</label>
                    <input type="number" step="0.01" id="item-amount" placeholder="0.00">
                    <span id="error-amount" class="error"></span>
                </div>

                <div>
                    <label for="item-category">Category</label>
                    <select id="item-category">
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Fun">Fun</option>
                    </select>
                    <span id="error-category" class="error"></span>
                </div>

                <button type="submit">Add Transaction</button>
            </form>
        </section>

        <!-- Visual Chart -->
        <section>
            <h2>Spending Distribution</h2>
            <div class="chart-container">
                <canvas id="spending-chart"></canvas>
                <p id="chart-empty-state">No spending data to display yet.</p>
            </div>
        </section>

        <!-- Transaction List -->
        <section>
            <h2>Transaction History</h2>
            
            <p id="empty-state">No transactions added yet.</p>

            <ul id="transaction-items">
                <!-- Dynamically populated via UIRenderer -->
            </ul>
        </section>

    </div>

    <!-- Link your main app file (disesuaikan ke folder js/) -->
    <script src="js/app.js"></script>
</body>
</html>
